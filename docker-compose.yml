services:
  fl_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl_server
    container_name: vfi_fl_server
    ports:
      - "8080:8080"
    volumes:
      - ./schemas:/app/schemas
      - ./fl_implementation:/app/fl_implementation
    networks:
      - federated_network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  bank_node_1:
    build:
      context: .
      dockerfile: docker/Dockerfile.bank_node
    container_name: vfi_bank_node_1
    environment:
      - NODE_ID=1
      - SERVER_ADDRESS=fl_server:8080
      - DATA_FILE=/app/data.csv
    volumes:
      - ./fl_implementation/data/bank_1.csv:/app/data.csv:ro
    depends_on:
      fl_server:
        condition: service_healthy
    networks:
      - federated_network

  bank_node_2:
    build:
      context: .
      dockerfile: docker/Dockerfile.bank_node
    container_name: vfi_bank_node_2
    environment:
      - NODE_ID=2
      - SERVER_ADDRESS=fl_server:8080
      - DATA_FILE=/app/data.csv
    volumes:
      - ./fl_implementation/data/bank_2.csv:/app/data.csv:ro
    depends_on:
      fl_server:
        condition: service_healthy
    networks:
      - federated_network

  bank_node_3:
    build:
      context: .
      dockerfile: docker/Dockerfile.bank_node
    container_name: vfi_bank_node_3
    environment:
      - NODE_ID=3
      - SERVER_ADDRESS=fl_server:8080
      - DATA_FILE=/app/data.csv
    volumes:
      - ./fl_implementation/data/bank_3.csv:/app/data.csv:ro
    depends_on:
      fl_server:
        condition: service_healthy
    networks:
      - federated_network

  bank_node_4:
    build:
      context: .
      dockerfile: docker/Dockerfile.bank_node
    container_name: vfi_bank_node_4
    environment:
      - NODE_ID=4
      - SERVER_ADDRESS=fl_server:8080
      - DATA_FILE=/app/data.csv
    volumes:
      - ./fl_implementation/data/bank_4.csv:/app/data.csv:ro
    depends_on:
      fl_server:
        condition: service_healthy
    networks:
      - federated_network

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: vfi_dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./schemas:/app/schemas:ro
      - ./blockchain:/app/blockchain:ro
      - ./dashboard/public:/app/dashboard/public
    networks:
      - federated_network

networks:
  federated_network:
    driver: bridge
